name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare version to registry
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/emulate/package.json').version")
          REGISTRY_VERSION=$(npm view @gmacko/emulate version 2>/dev/null || echo "0.0.0")
          echo "@gmacko/emulate — local: $LOCAL_VERSION, registry: $REGISTRY_VERSION"

          SHOULD_RELEASE=false
          if [ "$LOCAL_VERSION" != "$REGISTRY_VERSION" ]; then
            SHOULD_RELEASE=true
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Only @gmacko/emulate is published. The @emulators/* workspace
      # packages are bundled into it by tsup (noExternal) and the
      # @emulators npm scope is not ours. Auth uses an NPM_TOKEN secret
      # because Forgejo Actions has no npm OIDC trusted publishing.
      - name: Publish @gmacko/emulate
        run: |
          TARBALL=$(cd packages/emulate && pnpm pack --pack-destination /tmp | tail -1)
          npm publish "$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
