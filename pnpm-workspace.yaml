minimumReleaseAge: 2880

allowBuilds:
  "@mongodb-js/zstd@7.0.0": false
  "@parcel/watcher@2.5.6": false
  "esbuild@0.27.4": false
  "esbuild@0.28.1": false
  "msw@2.12.13": false
  "node-liblzma@2.2.0": false
  "redis-memory-server@0.10.0": false
  "sharp@0.34.5": false
  "unrs-resolver@1.11.1": false
  # miniflare's workerd runtime: its postinstall resolves the platform-specific
  # binary (@cloudflare/workerd-<os>-<arch>) that @emulators/cloudflare runs D1
  # and R2 on, so this build must be allowed.
  "workerd@1.20260730.1": true
  workerd: set this to true or false

packages:
  - "packages/*"
  - "packages/@emulators/*"
  - "apps/*"
  - "examples/*"
